name: PR Intent Comment

# Runs from the default branch after PR Checks finishes, so pull requests from
# forks get a findings comment without their code ever holding a write token.
# The report artifact comes from the untrusted run and is only ever parsed.
on:
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download the scan report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-intent-scan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pr-intent-scan

      # The check run is opened first and only completed once the comment is
      # published and read back, so a green check means the verdict is readable.
      - name: Post or update the findings comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bun scripts/pr-intent-comment.ts
          --report "$RUNNER_TEMP/pr-intent-scan/pr-intent-scan.json"
          --pr "${{ github.event.workflow_run.pull_requests[0].number }}"
          --repo "${{ github.repository }}"
          --head-sha "${{ github.event.workflow_run.head_sha }}"
