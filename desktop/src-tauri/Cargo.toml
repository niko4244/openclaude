[package]
name = "openclaude-desktop"
version = "0.1.0"
description = "OpenClaude Desktop - a desktop AI workspace on your own LiteLLM gateway"
authors = ["OpenClaude contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
url = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
xcap = "0.9.8"
enigo = "0.6.1"
pdf-extract = "0.12.1"
sha2 = "0.11.1"
rand = "0.10.3"
tauri-plugin-autostart = "2"
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3"
