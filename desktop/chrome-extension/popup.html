<!doctype html>
<html><head><meta charset="utf-8"><title>OpenClaude</title>
<style>
body{font:13px "Segoe UI",system-ui,sans-serif;margin:12px;width:280px;color:#29261f}
h1{font-size:15px;margin:0 0 8px} label{display:block;margin:8px 0 3px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #d3cdc0;border-radius:7px}
button{margin-top:10px;padding:6px 12px;border:0;border-radius:7px;background:#1f7a68;color:#fff;cursor:pointer}
#status{margin-top:10px;color:#6d6a62} p{color:#6d6a62;margin:6px 0 0}
</style></head>
<body>
<h1>OpenClaude Desktop</h1>
<p>Copy the port and pairing token from OpenClaude → Settings → General → Chrome extension.</p>
<label for="port">Port</label><input id="port" inputmode="numeric">
<label for="token">Pairing token</label><input id="token" type="password" autocomplete="off">
<button id="save">Save and connect</button>
<div id="status" role="status">…</div>
<script src="popup.js"></script>
</body></html>
